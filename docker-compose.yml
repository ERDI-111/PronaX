version: '3.8'

services:
  pronax-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pronax_production
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_APP_URL=https://pronax-ks.com
      - PAYMENT_PROVIDER=sandbox
      - LISTING_FEE_EUR=7.00
      - LISTING_DURATION_DAYS=30
      # Google sign-in: passed through from the environment docker compose runs in
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/admin/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
